<style>
/* Test page — page-local pieces only; the base look is the shared
   styles.css. The language toggle mirrors the play page's. */
.lang-select { font-size: .92rem; color: var(--ink-soft); margin: 0; }
.lang-select button { background: none; border: none; font: inherit; color: var(--ink-soft); cursor: pointer; padding: 2px 5px; min-height: 0; }
.lang-select button.active { color: var(--ink); font-weight: 700; }
.qr-card { text-align: center; margin: 4px 0 6px; }
.qr-card img {
  width: min(272px, 70vw); height: auto;
  background: #fff; border: 1px solid var(--border); border-radius: 16px;
  padding: 14px;
}
.cta-row { text-align: center; margin: 18px 0 2px; }
.cta-row.left { text-align: left; margin: 12px 0 2px; }
.cta-button {
  display: inline-block; background: var(--orange); color: #FFF7EA;
  font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded",
    "Segoe UI", Roboto, sans-serif;
  font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em;
  text-decoration: none; padding: 13px 30px; border-radius: 999px;
  transition: background-color .18s ease, transform .18s ease;
}
.cta-button:hover { background: var(--orange-dark); transform: translateY(-1px); }
.note {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 20px;
}
.note p { margin: 0; }
</style>

var LANG_KEY = "sixways.lang";
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
var lang = (function () {
  var saved = lsGet(LANG_KEY);
  if (saved === "en" || saved === "fr") return saved;
  var nav = (navigator.language || "en").toLowerCase();
  return nav.indexOf("fr") === 0 ? "fr" : "en";
})();
function setLang(next) {
  if (next !== "en" && next !== "fr") return;
  lang = next;
  lsSet(LANG_KEY, next);
  applyLanguage();
}
function applyLanguage() {

  var langEn = document.getElementById("btn-lang-en");
  var langFr = document.getElementById("btn-lang-fr");

  langFr.classList.toggle("active", lang === "fr");
  langEn.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
  langFr.setAttribute("aria-pressed", lang === "fr" ? "true" : "false");
}
document.getElementById("btn-lang-en").addEventListener("click", function () { setLang("en"); });
document.getElementById("btn-lang-fr").addEventListener("click", function () { setLang("fr"); });
applyLanguage();
</script>
